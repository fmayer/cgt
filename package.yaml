name:                cgt
version:             0.1.0.0
github:              "segfaulthunter/cgt"
license:             BSD3
author:              "Florian Mayer"
maintainer:          "florian.mayer@bitsrc.org"
copyright:           "Copyright 2018 Florian Mayer"

extra-source-files:
- README.md
- ChangeLog.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/segfaulthunter/cgt#readme>

dependencies:
- base >= 4.7 && < 5
- cassava
- bytestring
- text
- vector
- scientific
- time
- unordered-containers
- hashable
- Decimal

library:
  source-dirs: src

executables:
  cgt-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - cgt

tests:
  cgt-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - cgt
    - tasty
    - tasty-th
    - tasty-hunit
